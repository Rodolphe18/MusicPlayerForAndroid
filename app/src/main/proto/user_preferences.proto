syntax = "proto3";

option java_package = "com.francotte.contentproviderformusic";
option java_multiple_files = true;

message UserPreferences {

  map<string, bool> favorite_titles = 1;

  repeated Playlist playlists = 2;

  // Inverse de "lecture auto au démarrage" : proto3 met false par défaut, ce qui
  // correspond à l'auto-play ACTIVÉ (comportement historique). L'utilisateur passe
  // ce champ à true pour désactiver le démarrage automatique.
  bool autoplay_disabled = 3;

}

message Playlist {
  int64 id = 1;
  string title = 2;
  string description = 3;
  repeated string song_titles = 4;   // clé = Song.title, comme les favoris
}
